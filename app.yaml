# Databricks Apps entry point.
#
# This file sits at the PROJECT ROOT, not inside app/, because the app imports
# the engine from src/. Deploy the whole project folder as the app source.
#
# DEMO_CATALOG and DATABRICKS_HTTP_PATH are the two settings that make or break
# a first deployment. If DEMO_CATALOG is missing the app fails at startup; if
# DATABRICKS_HTTP_PATH is missing every panel errors. Set both.

command:
  - streamlit
  - run
  - app/app.py

env:
  # The Unity Catalog holding the demo schemas. Must be a simple identifier.
  - name: DEMO_CATALOG
    value: "eb_householding_demo"

  # Force the SQL Warehouse backend. Without this the app would fall back to
  # looking for local parquet, which does not exist on an App instance.
  - name: EB_STORE
    value: "sql"

  # The SQL Warehouse. Bind one to the App as a resource with the key
  # "sql-warehouse" and this picks it up.
  #
  # Note: a warehouse resource injects the warehouse ID, not an HTTP path.
  # The app handles both. It accepts a bare id like "a1b2c3d4e5f6g7h8" or a
  # full path like "/sql/1.0/warehouses/a1b2c3d4e5f6g7h8", so you can use
  # valueFrom below or paste either form as a literal value.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"

  # Alternative to the above if you would rather paste the HTTP path from
  # SQL Warehouses -> your warehouse -> Connection details.
  # - name: DATABRICKS_HTTP_PATH
  #   value: "/sql/1.0/warehouses/a1b2c3d4e5f6g7h8"

  # Household grouping rule: ADDRESS_ONLY or NAME_AND_ADDRESS.
  - name: EB_HOUSEHOLD_RULE
    value: "ADDRESS_ONLY"

  # Optional. Job id that runs notebook 02. When set, the app triggers a
  # republish after a steward decision instead of asking you to run a notebook.
  # Grant the app's service principal CAN MANAGE RUN on that job.
  # - name: EB_PUBLISH_JOB_ID
  #   value: "123456789"
